name: Update airport data

# Downloads OurAirports (airports, runways, VOR/NDB navaids) into
# public/data/ourairports.json, commits it if it changed, and redeploys.
on:
  schedule:
    - cron: '17 4 1 * *' # monthly
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite-node scripts/build-airport-data.ts
        env:
          # Optional: a free openAIP API key adds more VOR/NDB beacons.
          OPENAIP_API_KEY: ${{ secrets.OPENAIP_API_KEY }}
      - name: Commit if changed
        id: commit
        run: |
          git add public/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Airport data unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update airport data from OurAirports ($(date -u +%Y-%m-%d))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Pushes made with the workflow token don't start other workflows, so
      # start the Pages deploy explicitly.
      - name: Redeploy site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${{ github.ref_name }}"
