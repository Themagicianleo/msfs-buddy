<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- MSFS Buddy: a Liquid Glass app icon. A sky gradient with soft glows,
       a frosted glass lens with a bright refracting rim, and a white
       aircraft flying a dashed route from a departure dot to an arrival ring. -->
  <defs>
    <linearGradient id="sky" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#4fc3ff"/>
      <stop offset="0.45" stop-color="#2f6bff"/>
      <stop offset="1" stop-color="#5a32e8"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.86" cy="0.9" r="0.55">
      <stop offset="0" stop-color="#ff9a62" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff9a62" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="0.12" cy="0.08" r="0.6">
      <stop offset="0" stop-color="#b8f1ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#b8f1ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="rim" x1="0.15" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#fff" stop-opacity="0.98"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="0.65" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="plane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#e3ecff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1a1060" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="icon"><rect width="512" height="512" rx="114"/></clipPath>
    <clipPath id="lensClip"><circle cx="256" cy="262" r="168"/></clipPath>
  </defs>

  <g clip-path="url(#icon)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <rect width="512" height="512" fill="url(#cool)"/>
    <rect width="512" height="512" fill="url(#warm)"/>

    <!-- glass lens -->
    <g filter="url(#shadow)">
      <circle cx="256" cy="262" r="168" fill="url(#glass)"/>
    </g>
    <g clip-path="url(#lensClip)">
      <!-- refraction: a brighter, slightly shifted copy of the glows inside the lens -->
      <ellipse cx="190" cy="150" rx="150" ry="90" fill="#fff" opacity="0.22" filter="url(#soft)"/>
      <ellipse cx="330" cy="390" rx="120" ry="60" fill="#ffc29a" opacity="0.28" filter="url(#soft)"/>
      <!-- route: departure dot, dashed curved track, arrival ring -->
      <path d="M170 360 C 185 285, 300 300, 330 190" fill="none" stroke="#fff" stroke-opacity="0.85" stroke-width="12" stroke-linecap="round" stroke-dasharray="0.5 26"/>
      <circle cx="170" cy="362" r="15" fill="#34d27b" stroke="#fff" stroke-width="5"/>
    </g>
    <circle cx="256" cy="262" r="166" fill="none" stroke="url(#rim)" stroke-width="5"/>
    <circle cx="256" cy="262" r="155" fill="none" stroke="#fff" stroke-opacity="0.16" stroke-width="2"/>

    <!-- arrival ring -->
    <circle cx="334" cy="180" r="24" fill="none" stroke="#fff" stroke-width="9"/>
    <circle cx="334" cy="180" r="7" fill="#fff"/>

    <!-- aircraft, flying up and to the right along the track -->
    <g transform="translate(258 270) rotate(35) scale(6.6) translate(-12 -12)" filter="url(#shadow)">
      <path fill="url(#plane)" d="M21 15.6v-1.7l-7.6-4.8V4.2a1.4 1.4 0 0 0-2.8 0v4.9L3 13.9v1.7l7.6-2.4v4.6l-2 1.5V21l3.4-1 3.4 1v-1.3l-2-1.5v-4.6z"/>
    </g>

    <!-- top specular sheen and a thin bright edge, like a glass tile -->
    <path d="M0 0H512V170C380 205 132 205 0 170Z" fill="url(#sheen)" opacity="0.35"/>
    <rect x="2" y="2" width="508" height="508" rx="112" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="4"/>
  </g>
</svg>
