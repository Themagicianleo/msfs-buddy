<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2aa5ff"/>
      <stop offset="1" stop-color="#0057d9"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2547"/>
      <stop offset="1" stop-color="#081830"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="r"><rect width="512" height="512" rx="114"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#sheen)"/>
    <!-- tablet -->
    <rect x="128" y="84" width="256" height="344" rx="44" fill="#ffffff"/>
    <rect x="150" y="112" width="212" height="288" rx="24" fill="url(#screen)"/>
    <!-- route: departure dot, curved dashed track, arrival ring -->
    <path d="M196 348 C 200 260, 300 280, 312 172" fill="none" stroke="#5ac8fa" stroke-width="19" stroke-linecap="round" stroke-dasharray="1 30"/>
    <circle cx="196" cy="348" r="17" fill="#30d158"/>
    <circle cx="312" cy="168" r="22" fill="none" stroke="#ffffff" stroke-width="10"/>
    <circle cx="312" cy="168" r="6" fill="#ffffff"/>
  </g>
</svg>
